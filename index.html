<!DOCTYPE html>
<html>

<head>
    <title>Client Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .box {
            background: white;
            padding: 25px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        input {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>🛒 Client Login</h2>

        <input type="text" id="name" placeholder="Full Name">

        <input type="text" id="address" placeholder="Address">

        <input type="text" id="phone" placeholder="Phone Number">

        <button onclick="saveUser()">Login</button>

    </div>

    <script>
        function saveUser() {

            localStorage.setItem(
                "name",
                document.getElementById("name").value
            );

            localStorage.setItem(
                "address",
                document.getElementById("address").value
            );

            localStorage.setItem(
                "phone",
                document.getElementById("phone").value
            );

            window.location.href = "shop1.html";
        }
    </script>

</body>

</html>
